spring.application.name=login-service

server.port=9081
services.project-stage.url=http://localhost:9085

internal.security.api-key=InsightzzInternalAuth@2026

# =====================================================
# FEIGN TIMEOUT
# =====================================================

spring.cloud.openfeign.client.config.project-stage-service.connectTimeout=2000
spring.cloud.openfeign.client.config.project-stage-service.readTimeout=3000


# =====================================================
# CIRCUIT BREAKER
# =====================================================

resilience4j.circuitbreaker.instances.projectStageService.slidingWindowType=COUNT_BASED

resilience4j.circuitbreaker.instances.projectStageService.slidingWindowSize=10

resilience4j.circuitbreaker.instances.projectStageService.minimumNumberOfCalls=5

resilience4j.circuitbreaker.instances.projectStageService.failureRateThreshold=50

resilience4j.circuitbreaker.instances.projectStageService.waitDurationInOpenState=30s

resilience4j.circuitbreaker.instances.projectStageService.permittedNumberOfCallsInHalfOpenState=2

resilience4j.circuitbreaker.instances.projectStageService.automaticTransitionFromOpenToHalfOpenEnabled=true

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/system_monitoring?useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=insightzz@123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA
# =========================================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# JWT
# =========================================================

jwt.secret=ASsqb11Bh2B52uTCt3G24k+9mjthMjEjcdsockK2W+U=
